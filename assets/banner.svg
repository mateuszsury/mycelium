<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="bnNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#43e97b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#43e97b"/>
    </linearGradient>
    <linearGradient id="bnLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#43e97b;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="bnGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bannerBg)"/>

  <!-- Decorative mesh network (left side, behind logo) -->
  <g filter="url(#bnGlow)" fill="none" stroke="url(#bnLineGrad)" stroke-linecap="round" opacity="0.4">
    <path d="M30 40 Q50 60 80 55" stroke-width="1.2"/>
    <path d="M80 55 Q110 50 130 70" stroke-width="1.2"/>
    <path d="M30 40 Q40 70 55 90" stroke-width="1"/>
    <path d="M55 90 Q70 110 80 130" stroke-width="1"/>
    <path d="M80 55 Q75 80 55 90" stroke-width="1"/>
    <path d="M130 70 Q140 95 130 120" stroke-width="1"/>
    <path d="M80 130 Q100 140 130 120" stroke-width="1"/>
    <path d="M30 160 Q50 140 80 130" stroke-width="1"/>
    <path d="M130 120 Q150 130 170 120" stroke-width="0.8"/>
    <path d="M130 70 Q155 60 170 70" stroke-width="0.8"/>
  </g>
  <g filter="url(#bnGlow)">
    <circle cx="30" cy="40" r="3" fill="url(#bnNodeGrad)" opacity="0.5"/>
    <circle cx="80" cy="55" r="3" fill="url(#bnNodeGrad)" opacity="0.5"/>
    <circle cx="130" cy="70" r="3" fill="url(#bnNodeGrad)" opacity="0.5"/>
    <circle cx="55" cy="90" r="3" fill="url(#bnNodeGrad)" opacity="0.5"/>
    <circle cx="80" cy="130" r="3" fill="url(#bnNodeGrad)" opacity="0.5"/>
    <circle cx="130" cy="120" r="3" fill="url(#bnNodeGrad)" opacity="0.5"/>
    <circle cx="30" cy="160" r="3" fill="url(#bnNodeGrad)" opacity="0.5"/>
    <circle cx="170" cy="120" r="2" fill="url(#bnNodeGrad)" opacity="0.3"/>
    <circle cx="170" cy="70" r="2" fill="url(#bnNodeGrad)" opacity="0.3"/>
  </g>

  <!-- Decorative mesh network (right side) -->
  <g filter="url(#bnGlow)" fill="none" stroke="url(#bnLineGrad)" stroke-linecap="round" opacity="0.3">
    <path d="M650 30 Q670 50 700 45" stroke-width="1"/>
    <path d="M700 45 Q730 50 750 35" stroke-width="1"/>
    <path d="M700 45 Q710 75 730 90" stroke-width="1"/>
    <path d="M730 90 Q750 100 770 95" stroke-width="0.8"/>
    <path d="M650 165 Q680 150 710 160" stroke-width="1"/>
    <path d="M710 160 Q740 155 760 170" stroke-width="1"/>
    <path d="M730 90 Q720 120 710 160" stroke-width="0.8"/>
  </g>
  <g filter="url(#bnGlow)">
    <circle cx="650" cy="30" r="2" fill="url(#bnNodeGrad)" opacity="0.4"/>
    <circle cx="700" cy="45" r="2" fill="url(#bnNodeGrad)" opacity="0.4"/>
    <circle cx="750" cy="35" r="2" fill="url(#bnNodeGrad)" opacity="0.4"/>
    <circle cx="730" cy="90" r="2" fill="url(#bnNodeGrad)" opacity="0.4"/>
    <circle cx="770" cy="95" r="2" fill="url(#bnNodeGrad)" opacity="0.4"/>
    <circle cx="650" cy="165" r="2" fill="url(#bnNodeGrad)" opacity="0.4"/>
    <circle cx="710" cy="160" r="2" fill="url(#bnNodeGrad)" opacity="0.4"/>
    <circle cx="760" cy="170" r="2" fill="url(#bnNodeGrad)" opacity="0.4"/>
  </g>

  <!-- Logo (mini version) -->
  <g transform="translate(220, 30)">
    <!-- Logo circle bg -->
    <circle cx="60" cy="60" r="55" fill="none" stroke="url(#bnNodeGrad)" stroke-width="1.5" opacity="0.3"/>
    <!-- Connections -->
    <g filter="url(#bnGlow)" fill="none" stroke="url(#bnLineGrad)" stroke-linecap="round">
      <path d="M60 35 Q70 48 60 60" stroke-width="2"/>
      <path d="M60 60 Q48 72 38 82" stroke-width="2"/>
      <path d="M60 60 Q72 72 82 82" stroke-width="2"/>
      <path d="M60 60 Q42 55 28 48" stroke-width="2"/>
      <path d="M60 60 Q78 55 94 50" stroke-width="2"/>
      <path d="M28 48 Q18 38 14 30" stroke-width="1.2"/>
      <path d="M94 50 Q102 40 108 32" stroke-width="1.2"/>
      <path d="M38 82 Q28 88 22 95" stroke-width="1.2"/>
      <path d="M82 82 Q92 88 98 95" stroke-width="1.2"/>
      <path d="M60 35 Q48 28 38 22" stroke-width="1.2"/>
      <path d="M60 35 Q72 28 82 22" stroke-width="1.2"/>
    </g>
    <!-- Nodes -->
    <g filter="url(#bnGlow)">
      <circle cx="60" cy="60" r="7" fill="url(#bnNodeGrad)"/>
      <circle cx="60" cy="60" r="3.5" fill="#fff" opacity="0.9"/>
      <circle cx="60" cy="35" r="4.5" fill="url(#bnNodeGrad)"/>
      <circle cx="28" cy="48" r="4.5" fill="url(#bnNodeGrad)"/>
      <circle cx="94" cy="50" r="4.5" fill="url(#bnNodeGrad)"/>
      <circle cx="38" cy="82" r="4.5" fill="url(#bnNodeGrad)"/>
      <circle cx="82" cy="82" r="4.5" fill="url(#bnNodeGrad)"/>
      <circle cx="14" cy="30" r="2.5" fill="url(#bnNodeGrad)" opacity="0.7"/>
      <circle cx="108" cy="32" r="2.5" fill="url(#bnNodeGrad)" opacity="0.7"/>
      <circle cx="22" cy="95" r="2.5" fill="url(#bnNodeGrad)" opacity="0.7"/>
      <circle cx="98" cy="95" r="2.5" fill="url(#bnNodeGrad)" opacity="0.7"/>
      <circle cx="38" cy="22" r="2.5" fill="url(#bnNodeGrad)" opacity="0.7"/>
      <circle cx="82" cy="22" r="2.5" fill="url(#bnNodeGrad)" opacity="0.7"/>
    </g>
  </g>

  <!-- Text -->
  <text x="370" y="85" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#textGrad)" letter-spacing="-1">Mycelium</text>
  <text x="372" y="120" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#a0a0c0" letter-spacing="0.5">ESP-NOW Mesh Networking for MicroPython</text>

  <!-- Version badge -->
  <g transform="translate(372, 138)">
    <rect width="52" height="20" rx="10" fill="url(#bnNodeGrad)" opacity="0.15"/>
    <rect width="52" height="20" rx="10" fill="none" stroke="url(#bnNodeGrad)" stroke-width="0.8" opacity="0.4"/>
    <text x="26" y="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#43e97b" text-anchor="middle" opacity="0.9">v0.1.0</text>
  </g>
</svg>
